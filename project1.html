<!DOCTYPE html>
<html>
<head>
  <title>Student Registration Form</title>
  <style>
      * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background-color: #f4f6f9;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.container {
  background-color: #ffffff;
  width: 100%;
  max-width: 500px;
  padding: 25px 30px;
}

.container h2 {
  text-align: center;
  margin-bottom: 20px;
  color: #333333;
}

.form-group {
  margin-bottom: 15px;
}

.form-group label {
  display: block;
  margin-bottom: 5px;
  font-weight: bold;
  color: #555555;
  font-size: 14px;
}

.form-group input,
.form-group select {
  width: 100%;
  padding: 10px;
  border: 1px solid #ccc;
  font-size: 14px;
}

.form-group input:focus,
.form-group select:focus {
  outline: none;
  border-color: #0066cc;
}

.button-group {
  #display: flex;
  justify-content: space-between;
  margin-top: 20px;
}

button {
  width: 48%;
  padding: 10px;
  border: none;
  border-radius: 4px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

.button-submit {
  background-color: #04AA6D;
  color: white;
}
</style>
</head>
<body>

  <div class="container">
    <h2>Student Registration</h2>
    <form action="register.html" method="POST">
      
      <div class="form-group">
        <label for="studentId">Student ID:</label>
        <input type="text" id="studentId" name="studentId" placeholder="e.g., STU12345" required>
      </div>

      <div class="form-group">
        <label for="fullName">Full Name:</label>
        <input type="text" id="fullName" name="fullName" placeholder="Enter full name" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" placeholder="student@college.edu" required>
      </div>

      <div class="form-group">
        <label for="mobile">Mobile Number (10 digits):</label>
        <input type="tel" id="mobile" name="mobile" pattern="[0-9]{10}" required>
      </div>

      <div class="form-group">
        <label for="course">Select Course:</label>
        <select id="course" name="course" required>
          <option value="">--Choose a Course--</option>
          <option value="Python">Python</option>
          <option value="Mern">Mern</option>
          <option value="AI">AI</option>
          <option value="Java">Java</option>
        </select>
      </div>

      <div class="form-group">
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" max="2004-01-01" required>
      </div>

      <div class="button-group">
        <button type="submit" class="button-submit">Register</button>
        
      </div>

    </form>
  </div>
</body>
</html>
